name: Organize USG v0.12

on:
  workflow_dispatch:
  push:
    branches:
      - organize-v0.12
    paths:
      - tools/import_release.py
      - .github/workflows/organize-v0-12.yml

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: organize-v0.12
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Organize release bundle
        run: python tools/import_release.py

      - name: Check protocol
        run: python tools/check_usg.py protocol/versions/USG_v0_12.json --previous protocol/versions/USG_v0_11.json

      - name: Run mutation suite
        run: python tests/test_runner.py protocol/versions/USG_v0_12.json

      - name: Run pinned instances
        shell: bash
        run: |
          set -e
          for f in conformance/instances/*.json; do
            python tools/run_usg.py protocol/versions/USG_v0_12.json "$f" --quiet
          done

      - name: Commit organized repository
        shell: bash
        run: |
          git config user.name "USG Repository Organizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Organize USG v0.12 into canonical repository structure"
            git push origin organize-v0.12
          fi
