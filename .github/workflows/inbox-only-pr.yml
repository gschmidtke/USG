name: Inbox-only external contributions

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  path-guard:
    name: inbox-only-path-guard
    runs-on: ubuntu-latest
    steps:
      - name: Validate changed paths without checking out contributor code
        uses: actions/github-script@v7
        with:
          script: |
            const ownerCurator = 'gschmidtke';
            const pr = context.payload.pull_request;
            const contributor = pr.user.login;

            if (contributor === ownerCurator) {
              core.notice(`Curator PR by ${contributor}: canonical paths are permitted.`);
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const changed = files.map(f => f.filename);
            const forbidden = changed.filter(path => !(path === 'inbox' || path.startsWith('inbox/')));

            if (forbidden.length > 0) {
              core.setFailed(
                'External contributions may modify only inbox/**. Forbidden paths: ' +
                forbidden.join(', ')
              );
            } else {
              core.notice(`Accepted contribution surface: ${changed.length} changed file(s), all under inbox/**.`);
            }
